<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0b0a}
#s{width:1440px;height:900px;background:radial-gradient(ellipse 70% 65% at 50% 42%,#22201c 0%,#121110 55%,#0a0a0a 95%)}canvas{width:100%;height:100%;display:block}</style></head>
<body><div id="s"><canvas id="c"></canvas></div><script type="module">
const qq = new URLSearchParams(location.search); const el = document.getElementById("s"); el.style.width = (qq.get("w") || 1440) + "px"; el.style.height = (qq.get("h") || 900) + "px";
import { createScene } from '../dist/assets/scene.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'cover';
const s = createScene(document.getElementById('c'), { mode, cover: +(q.get('n') || 0) });
if (mode === 'story') s.setStep(+(q.get('step') || 0));
window.done = true;
</script></body></html>
